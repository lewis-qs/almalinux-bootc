name: "Build and Push"
description: Build, rechunk, push, and sign the image via just recipes

inputs:
  VERSION_MAJOR:
    description: The major version of the image to build (e.g. 9, 10)
    required: true
  DATE_STAMP:
    description: The date stamp used for tagging the image (e.g. 20260403)
    required: true
  IMAGE_REGISTRY:
    description: The container registry to push the image to (e.g. ghcr.io/lewis-qs/bootc)
    required: true
  GITHUB_ACTOR:
    description: The username for authenticating with the container registry
    required: true
  GHCR_TOKEN:
    description: The token for authenticating with the container registry
    required: true
  SIGSTORE_PRIVATE_KEY:
    description: The sigstore private key to sign with
    required: true
  SIGSTORE_PASSPHRASE:
    description: The passphrase for the sigstore private key (empty if none)
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Prepare environment
      shell: bash
      run: |
        echo "VARIANT=--platform ${{ env.PLATFORM }}" >> "$GITHUB_ENV"
        echo "IMAGE_DEST=${{ inputs.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_ENV"
        ARCH=${{ matrix.ARCH }}
        echo "CLEAN_ARCH=${ARCH//\//_}" >> "$GITHUB_ENV"

    - name: Login to registry
      shell: bash
      env:
        IMAGE_REGISTRY: ${{ inputs.IMAGE_REGISTRY }}
        GITHUB_ACTOR: ${{ inputs.GITHUB_ACTOR }}
        GHCR_TOKEN: ${{ inputs.GHCR_TOKEN }}
      run: just ghcr-login

    - name: Check update
      shell: bash
      run: |
        # 'dnf check-update'
        # exit codes:
        #   0 - no updates
        #   100 - updates available
        #   125 - tag/platform not found
        #   127 - command not found
        res=0
        sudo podman run ${{ env.VARIANT }} --quiet --rm ${{ inputs.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.VERSION_MAJOR }} dnf check-update || res=$?
        echo "res=${res}" >> "$GITHUB_ENV"
        echo "Exit code: '$res'"

    - name: Build image
      id: build
      if: ${{ env.res != 0 || github.event_name == 'workflow_dispatch' }}
      shell: bash
      env:
        PLATFORM: ${{ env.PLATFORM }}
        VERSION_MAJOR: ${{ inputs.VERSION_MAJOR }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
      run: just image

    - name: Run Image
      id: run
      if: ${{ env.res != 0 || github.event_name == 'workflow_dispatch' }}
      shell: bash
      run: |
        IMAGE="localhost/${{ env.IMAGE_NAME }}:latest"
        sudo podman run ${{ env.VARIANT }} --rm -ti "$IMAGE" bootc --version

        INFO=$(sudo podman run ${{ env.VARIANT }} --rm "$IMAGE" bash -c "rpm -q almalinux-gpg-keys && cat /etc/os-release")
        echo "$INFO"

        echo "id=$(echo "$INFO" | grep "^ID=" | cut -d'=' -f2 | tr -d '"')" >> $GITHUB_OUTPUT
        echo "version-id=$(echo "$INFO" | grep "^VERSION_ID=" | cut -d'=' -f2 | tr -d '"')" >> $GITHUB_OUTPUT
        echo "long-version=$(echo "$INFO" | grep "^VERSION_ID=" | cut -d'=' -f2 | tr -d '"').${{ inputs.DATE_STAMP }}.0" >> $GITHUB_OUTPUT
        echo "vendor=$(echo "$INFO" | grep "^VENDOR_NAME=" | cut -d'=' -f2 | tr -d '"')" >> $GITHUB_OUTPUT

    - name: Rechunk image
      id: rechunk
      if: ${{ env.res != 0 || github.event_name == 'workflow_dispatch' }}
      shell: bash
      env:
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
      run: |
        BUILD_TIME=$(date -Iseconds)
        LABELS=$(cat <<EOF
        redhat.id=${{ steps.run.outputs.id }}
        redhat.version-id=${{ steps.run.outputs.version-id }}
        version=${{ steps.run.outputs.version-id }}
        release=${{ steps.run.outputs.version-id }}
        build-date=${BUILD_TIME}
        org.opencontainers.image.created=${BUILD_TIME}
        org.opencontainers.image.version=${{ steps.run.outputs.long-version }}
        org.opencontainers.image.source=${{ github.repositoryUrl }}
        org.opencontainers.image.title=${{ env.IMAGE_NAME }}
        org.opencontainers.image.url=${{ github.event.repository.html_url }}
        containers.bootc=1
        ostree.bootable=1
        EOF
        )
        export LABELS
        just rechunk

    - name: Push and sign
      id: push
      if: ${{ env.res != 0 || github.event_name == 'workflow_dispatch' }}
      shell: bash
      env:
        VERSION: ${{ steps.run.outputs.version-id }}
        GITHUB_ACTOR: ${{ inputs.GITHUB_ACTOR }}
        GHCR_TOKEN: ${{ inputs.GHCR_TOKEN }}
        SIGSTORE_PRIVATE_KEY: ${{ inputs.SIGSTORE_PRIVATE_KEY }}
        SIGSTORE_PASSPHRASE: ${{ inputs.SIGSTORE_PASSPHRASE }}
      run: |
        REF="${IMAGE_DEST}:${VERSION}-${{ inputs.DATE_STAMP }}-${CLEAN_ARCH}"
        just push-image "$REF" "localhost/${{ env.IMAGE_NAME }}:latest"
        echo "digest=$(cat /tmp/digestfile)" >> $GITHUB_OUTPUT

    - name: Create Job Outputs
      if: ${{ env.res != 0 || github.event_name == 'workflow_dispatch' }}
      shell: bash
      run: |
        mkdir -p /tmp/outputs/digests

        jq -n --arg platform "${{ matrix.ARCH }}" \
          --arg major "${{ inputs.VERSION_MAJOR }}" \
          --arg digest "${{ steps.push.outputs.digest }}" \
          --arg id "${{ steps.run.outputs.id }}" \
          --arg version "${{ steps.run.outputs.version-id }}" \
          --arg long_version "${{ steps.run.outputs.long-version }}" \
          --arg vendor "${{ steps.run.outputs.vendor }}" \
          '{($platform): {digest: $digest, id: $id, version: $version, major: $major, long_version: $long_version, vendor: $vendor}}' \
          > /tmp/outputs/digests/${{ env.IMAGE_NAME }}_${{ matrix.VERSION_MAJOR }}_${{ env.CLEAN_ARCH }}.json

        cat /tmp/outputs/digests/${{ env.IMAGE_NAME }}_${{ matrix.VERSION_MAJOR }}_${{ env.CLEAN_ARCH }}.json

    - name: Upload Output Artifacts
      if: ${{ env.res != 0 || github.event_name == 'workflow_dispatch' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ env.IMAGE_NAME }}_${{ matrix.VERSION_MAJOR }}_${{ env.CLEAN_ARCH }}
        retention-days: 1
        if-no-files-found: error
        path: |
          /tmp/outputs/digests/*.json
