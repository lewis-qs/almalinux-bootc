---
name: Sign image

inputs:
  image-ref:
    description: The tagged image reference the signature is attached to
    required: true
  digest:
    description: The manifest digest (sha256:...) that is signed and verified
    required: true
  multi-arch:
    description: Pass "index-only" to sign a manifest list index
    required: false
    default: ''
  public-key:
    description: Path to the committed public key the signature is verified against
    required: true
  SIGSTORE_PRIVATE_KEY:
    description: The sigstore private key (cosign format) to sign with
    required: true
  SIGSTORE_PASSPHRASE:
    description: The passphrase for the sigstore private key (empty if none)
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Install skopeo
      shell: bash
      run: command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }

    - name: Sign image
      shell: bash
      env:
        SIGSTORE_PRIVATE_KEY: ${{ inputs.SIGSTORE_PRIVATE_KEY }}
        SIGSTORE_PASSPHRASE: ${{ inputs.SIGSTORE_PASSPHRASE }}
        IMAGE_REF: ${{ inputs.image-ref }}
        DIGEST: ${{ inputs.digest }}
        MULTI_ARCH: ${{ inputs.multi-arch }}
        PUBLIC_KEY: ${{ inputs.public-key }}
      run: |
        export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
        install -m 700 -d "$HOME/.sigstore"
        trap 'rm -f "$HOME/.sigstore/key.private" "$HOME/.sigstore/pass"' EXIT
        printf '%s' "$SIGSTORE_PRIVATE_KEY" > "$HOME/.sigstore/key.private"
        printf '%s' "$SIGSTORE_PASSPHRASE" > "$HOME/.sigstore/pass"
        chmod 600 "$HOME/.sigstore/key.private" "$HOME/.sigstore/pass"

        install -m 755 -d "$HOME/.config/containers/registries.d"
        cat > "$HOME/.config/containers/registries.d/sign.yaml" <<EOF
        docker:
          ${IMAGE_REF%%/*}:
            use-sigstore-attachments: true
        EOF

        REPO=${IMAGE_REF%:*}
        SRC="docker://${REPO}@${DIGEST}"

        MA=()
        [ -n "$MULTI_ARCH" ] && MA=(--multi-arch "$MULTI_ARCH")

        skopeo copy --preserve-digests "${MA[@]}" \
          --sign-by-sigstore-private-key "$HOME/.sigstore/key.private" \
          --sign-passphrase-file "$HOME/.sigstore/pass" \
          "$SRC" "docker://${IMAGE_REF}"

        cat > "$HOME/.sigstore/policy.json" <<EOF
        {"default":[{"type":"reject"}],"transports":{"docker":{"${REPO}":[{"type":"sigstoreSigned","keyPath":"${PUBLIC_KEY}","signedIdentity":{"type":"matchRepository"}}]}}}
        EOF

        rm -rf "$HOME/.sigstore/verify"
        skopeo copy --preserve-digests "${MA[@]}" \
          --policy "$HOME/.sigstore/policy.json" \
          "$SRC" "dir:$HOME/.sigstore/verify"
        rm -rf "$HOME/.sigstore/verify"
