releasever: 9

repos:
  - baseos
  - appstream

variables:
  distro: "almalinux9"

recommends: true

packages:
  - almalinux-repos
  - bubblewrap
  - clevis-dracut
  - gnome-shell
  - gdm
  - mutter
  - gnome-session
  - gnome-settings-daemon
  - gnome-control-center
  - gnome-keyring
  - gnome-initial-setup
  - nautilus
  - flatpak
  - gnome-terminal
  - xdg-desktop-portal-gnome
  - pipewire
  - pipewire-pulseaudio
  - wireplumber
  - plymouth
  - plymouth-system-theme
  - NetworkManager-wifi
  - mesa-dri-drivers
  - google-noto-sans-fonts
  - dejavu-sans-fonts
  - power-profiles-daemon
  # Include and set the default editor
  - nano
  - nfs-utils
  # Additional firewall support; we aren't including these in RHCOS or they
  # don't exist in RHEL
  - iptables-services
  # Allow communication between sudo and SSSD
  # for caching sudo rules by SSSD.
  - libsss_sudo
  # SSSD; we only ship a subset of the backends
  - sssd-client sssd-ad sssd-ipa sssd-krb5 sssd-ldap
  - realmd
  # Used by admins interactively
  - openssl
  # Provides terminal tools like clear, reset, tput, and tset
  - ncurses
  # i18n
  - kbd
  # zram-generator (but not zram-generator-defaults) for F33 change
  # https://github.com/coreos/fedora-coreos-tracker/issues/509
  - zram-generator
  - sos
  # Make Ansible "package_facts" builtin work by default
  - python3-rpm
  # Used by admins interactively
  - man-db

# These are random architecture-specific packages
packages-x86_64:
  - irqbalance
  - WALinuxAgent-udev
  # TPM2 pin for Clevis LUKS auto-unlock
  - clevis-pin-tpm2

packages-ppc64le:
  - irqbalance
  - librtas
  - powerpc-utils-core
  - ppc64-diag-rtas

packages-aarch64:
  - irqbalance
  - WALinuxAgent-udev
  # TPM2 pin for Clevis LUKS auto-unlock
  - clevis-pin-tpm2

exclude-packages:
  - perl
  - perl-interpreter
  - nodejs
  - grubby
  - cowsay # Just in case
  # Let's make sure initscripts doesn't get pulled back in
  - initscripts
  # Do not use legacy ifcfg config format in NetworkManager
  - NetworkManager-initscripts-ifcfg-rh
  # Let's not have both legacy and nft versions in the image. Users are free to
  # also layer legacy themselves if they want.
  - iptables-legacy

postprocess:
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    mkdir -p /usr/lib/bootc/install/
    cat > /usr/lib/bootc/install/20-rhel.toml << EOF
    [install]
    root-fs-type = "xfs"
    EOF
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    mkdir -p /usr/lib/bootc/kargs.d/
    cat > /usr/lib/bootc/kargs.d/plymouth.toml << EOF
    kargs = ["splash", "quiet", "loglevel=3"]
    EOF
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    mkdir -p /usr/lib/systemd/system/bootc-fetch-apply-updates.service.d/
    cat > /usr/lib/systemd/system/bootc-fetch-apply-updates.service.d/10-no-apply.conf << EOF
    [Service]
    ExecStart=
    ExecStart=/usr/bin/bootc update --quiet
    EOF
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    dnf clean all
    rm /var/{log,cache,lib}/* -rf
    systemctl preset-all

include:
  - minimal-plus/manifest.yaml
  - standard/autoupdates.yaml
  - standard/generic-growfs.yaml
  - standard/initramfs-full.yaml
  - standard/networking-tools.yaml
  - standard/persistent-journal.yaml
  - standard/system-configuration.yaml
